apply plugin: 'com.android.application'

android {
    namespace 'dev.eta.certlab'
    compileSdk 34

    defaultConfig {
        applicationId "dev.eta.certlab"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
